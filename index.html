<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ticket Scanner</title>
<style>
  :root { --bg:#f3f4f6; --fg:#14171c; --card:#fff; --line:#d5d9e0; --ok:#12805c; --bad:#b3261e; --warn:#a15c00; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12151a; --fg:#f1f3f6; --card:#1c2027; --line:#333a45; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--fg);
         padding: env(safe-area-inset-top,0) 14px env(safe-area-inset-bottom,0); min-height:100vh; }
  main { max-width:480px; margin:0 auto; padding:14px 0 24px; }
  h1 { font-size:20px; margin:4px 0 12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:12px; }
  label { display:block; font-size:14px; margin-bottom:6px; }
  input[type=password], input[type=text] { width:100%; font-size:18px; padding:12px; border:1px solid var(--line);
         border-radius:8px; background:var(--bg); color:var(--fg); }
  button { font-size:17px; padding:12px 16px; border-radius:8px; border:0; background:var(--fg); color:var(--bg); font-weight:600; }
  button.ghost { background:transparent; color:var(--fg); border:1px solid var(--line); }
  .row { display:flex; gap:8px; align-items:center; }
  .row > input { flex:1; }
  #reader { width:100%; border-radius:10px; overflow:hidden; background:#000; min-height:0; }
  .check { display:flex; gap:8px; align-items:center; font-size:15px; margin-top:10px; }
  #count { font-size:14px; opacity:.8; }
  #overlay { position:fixed; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center;
             text-align:center; color:#fff; padding:24px; z-index:10; }
  #overlay.ok { background:var(--ok); } #overlay.bad { background:var(--bad); } #overlay.warn { background:var(--warn); }
  #big { font-size:56px; font-weight:800; line-height:1.05; }
  #sub { font-size:22px; margin-top:14px; }
  #hint { font-size:15px; margin-top:26px; opacity:.85; }
</style>
</head>
<body>
<main>
  <h1>Ticket Scanner</h1>

  <div class="card" id="login">
    <label for="pin">Staff PIN</label>
    <div class="row">
      <input id="pin" type="password" autocomplete="off">
      <button id="go">Start</button>
    </div>
  </div>

  <div id="app" hidden>
    <div class="card">
      <div id="reader"></div>
      <div class="check"><input type="checkbox" id="recheck"><label for="recheck" style="margin:0">Look up only (don't mark as used)</label></div>
      <div id="count" style="margin-top:8px"></div>
    </div>
    <div class="card">
      <label for="manual">Type the code from the ticket</label>
      <div class="row">
        <input id="manual" type="text" autocapitalize="characters" autocomplete="off" maxlength="24">
        <button id="manualGo" class="ghost">Check</button>
      </div>
    </div>
  </div>
</main>

<div id="overlay"><div id="big"></div><div id="sub"></div><div id="hint">Tap to continue</div></div>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
  // >>> PASTE YOUR APPS SCRIPT WEB APP URL HERE (ends with /exec) <<<
  const API_URL = 'https://script.google.com/macros/s/AKfycbwMwad85YYJgx0Z9EdqksojyUnmuIyOkBGH12UvyPNNOcUf3Ivklbf0io1POojRvYYGxA/exec';

  const $ = id => document.getElementById(id);
  let pin = '', busy = false, lastCode = '', lastTime = 0, scanner = null, dismissTimer = null;

  async function api(params) {
    const url = API_URL + '?' + new URLSearchParams({ pin, ...params }).toString();
    const res = await fetch(url);
    return res.json();
  }

  function show(kind, big, sub, autoMs) {
    const o = $('overlay');
    o.className = kind; o.style.display = 'flex';
    $('big').textContent = big; $('sub').textContent = sub || '';
    $('hint').style.display = autoMs ? 'none' : 'block';
    if (navigator.vibrate) navigator.vibrate(kind === 'ok' ? 80 : [120, 60, 120]);
    clearTimeout(dismissTimer);
    if (autoMs) dismissTimer = setTimeout(hide, autoMs);
  }
  function hide() { $('overlay').style.display = 'none'; busy = false; }
  $('overlay').addEventListener('click', hide);

  async function check(code) {
    code = code.trim().toUpperCase();
    if (!code || busy) return;
    busy = true;
    try {
      const data = await api({ t: code, action: $('recheck').checked ? 'lookup' : 'check' });
      if (data.result === 'valid') show('ok', 'VALID', data.note || (data.marked ? 'Checked in' : 'Not used yet'), 700);
      else if (data.result === 'used') show('bad', 'ALREADY USED', 'First scan: ' + (data.time || 'unknown'));
      else if (data.result === 'invalid') show('bad', 'INVALID', 'Not in the ticket list');
      else if (data.result === 'unauthorized') { show('bad', 'WRONG PIN', 'Reload the page and try again'); }
      else show('warn', 'ERROR', 'Try again');
    } catch (err) {
      show('warn', 'NO CONNECTION', 'Check signal, then tap and rescan');
    }
  }

  async function refreshCount() {
    try {
      const s = await api({ action: 'stats' });
      if (s.result === 'stats') $('count').textContent = s.used + ' of ' + s.total + ' checked in';
    } catch (e) {}
  }

  function onScan(text) {
    const now = Date.now();
    if (busy || (text === lastCode && now - lastTime < 4000)) return;
    lastCode = text; lastTime = now;
    check(text);
  }

  async function start() {
    pin = $('pin').value;
    if (!pin) return;
    localStorage.setItem('pin', pin);
    $('login').hidden = true; $('app').hidden = false;
    scanner = new Html5Qrcode('reader', {
    formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE],
    experimentalFeatures: { useBarCodeDetectorIfSupported: true }
    });
    try {
      await scanner.start({ facingMode: 'environment' }, { fps: 15, qrbox: { width: 240, height: 240 } }, onScan, () => {});
    } catch (e) {
      $('reader').textContent = 'Camera unavailable. Allow camera access, or type codes below.';
      $('reader').style.color = '#fff'; $('reader').style.padding = '16px';
    }
    refreshCount();
    setInterval(refreshCount, 30000);
  }

  $('go').addEventListener('click', start);
  $('pin').addEventListener('keydown', e => { if (e.key === 'Enter') start(); });
  $('manualGo').addEventListener('click', () => { check($('manual').value); $('manual').value = ''; });
  $('manual').addEventListener('keydown', e => { if (e.key === 'Enter') { check($('manual').value); $('manual').value = ''; } });
  const saved = localStorage.getItem('pin'); if (saved) { $('pin').value = saved; start(); } if (saved) { $('pin').value = saved; }
  $('pin').value = 'YOURPIN';
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book tickets</title>
<style>
  :root { --bg:#f3f4f6; --fg:#14171c; --card:#fff; --line:#d5d9e0; --ok:#12805c; --bad:#b3261e; --accent:#1d4ed8; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12151a; --fg:#f1f3f6; --card:#1c2027; --line:#333a45; --accent:#7aa2ff; } }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--fg); }
  main { max-width:520px; margin:0 auto; padding:20px 14px 40px; }
  h1 { font-size:26px; margin:6px 0 4px; }
  p.sub { margin:0 0 16px; opacity:.75; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:14px; }
  label { display:block; font-size:14px; font-weight:600; margin:12px 0 5px; }
  input, select { width:100%; font-size:16px; padding:11px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--fg); }
  .total { font-size:22px; font-weight:700; margin-top:14px; }
  button { width:100%; margin-top:16px; font-size:17px; padding:13px; border:0; border-radius:8px; background:var(--accent); color:var(--bg); font-weight:700; }
  button:disabled { opacity:.5; }
  .pay { border-left:4px solid var(--accent); }
  .pay h2 { font-size:16px; margin:0 0 6px; }
  #msg { display:none; padding:14px; border-radius:8px; margin-top:14px; font-weight:600; }
  #msg.ok { display:block; background:var(--ok); color:#fff; } #msg.bad { display:block; background:var(--bad); color:#fff; }
  .hp { position:absolute; left:-9999px; }
</style>
</head>
<body>
<main>
  <h1>Book your tickets</h1>
  <p class="sub">Event name · date · venue</p>

  <div class="card pay">
    <h2>How to pay</h2>
    <!-- EDIT: replace with your real payment details -->
    <div>1. Pay the total shown below to: <b>ACCOUNT NAME / NUMBER / BANK</b><br>
    2. Copy the <b>transaction / journal number</b> from your payment confirmation.<br>
    3. Fill in the form below with that number.<br>
    Your tickets are emailed after we verify the payment.</div>
  </div>

  <form class="card" id="f" autocomplete="on">
    <label for="name">Full name</label><input id="name" required>
    <label for="email">Email (tickets are sent here)</label>
    <input id="email" type="email" required>    <label for="phone">Phone</label><input id="phone" type="tel">
    <label for="qty">Number of tickets</label><select id="qty"></select>
    <div class="total">Total: <span id="total"></span></div>
    <label for="ref">Payment transaction / journal number</label><input id="ref" required>
    <input class="hp" id="website" tabindex="-1" autocomplete="off" aria-hidden="true">
    <button id="btn" type="submit">Submit booking</button>
    <div id="msg"></div>
  </form>
</main>

<script>
  // >>> EDIT THESE THREE LINES <<<
  const API_URL = 'https://script.google.com/macros/s/AKfycbwMwad85YYJgx0Z9EdqksojyUnmuIyOkBGH12UvyPNNOcUf3Ivklbf0io1POojRvYYGxA/exec';   // same /exec URL as the scanner
  const PRICE = 800, CURRENCY = 'Nu.';
  const MAX = 10;

  const $ = id => document.getElementById(id);
  for (let i = 1; i <= MAX; i++) $('qty').add(new Option(i, i));
  const upd = () => $('total').textContent = CURRENCY + ' ' + (PRICE * $('qty').value).toLocaleString();
  $('qty').addEventListener('change', upd); upd();

  function say(kind, text) { $('msg').className = kind; $('msg').textContent = text; }

  $('f').addEventListener('submit', async e => {
    e.preventDefault();
    try {
      const q = new URLSearchParams({ action: 'book', name: $('name').value, email: $('email').value, phone: $('phone').value,
        qty: $('qty').value, ref: $('ref').value, website: $('website').value });
      const d = await (await fetch(API_URL + '?' + q)).json();
      if (d.result === 'ok') { $('f').reset(); upd(); say('ok', 'Booking received' + (d.orderId ? ' (order ' + d.orderId + ')' : '') + '. Your tickets will be emailed once we confirm your payment. Check your spam folder too.'); }
      else if (d.result === 'duplicate') say('bad', 'That payment number was already used for a booking.');
      else if (d.result === 'soldout') say('bad', 'Sorry, not enough online tickets left.');
      else say('bad', 'Please check your details and try again.');
    } catch (err) { say('bad', 'Connection problem. Please try again.'); }
    $('btn').disabled = false;
  });
</script>
</body>
</html>
